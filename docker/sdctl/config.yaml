# sdctl's defaults in natsumi's workspace (ADR 0044), which /usr/local/bin/sdctl always passes with --config. They are
# here and not in the image's environment because natsumi's commands go through the runner, which gives a command only
# PATH, HOME, LANG and TZ (ADR 0019). With these, `sdctl txt2img --prompt <file>` needs nothing else.
# An environment variable of the same name (SDCTL_URL and so on) still wins, and a flag wins over both.
#
# The relay in the same Pod: the egress proxy listens on this loopback address and adds the token. The port is the
# environment overlay's promise too (it also gives the workspace SDCTL_URL with it); change both together.
url: http://127.0.0.1:17860
# The avatar's params, or the server's default, written by the server on every start (ADR 0057).
params: /manual/avatar/sdctl-params.yaml
output_dir: /work/images
# JPEG, as PNG is heavy; the server takes either by its content (ADR 0044, ADR 0045). A name given with -o still
# decides by its extension, and the quality is sdctl's default, 90.
format: jpeg
