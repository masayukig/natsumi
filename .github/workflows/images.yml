# Builds the server and workspace images for a version tag and pushes them to ghcr (ADR 0033).
# The image tag is the version tag itself (v0.x.y); the environment pins the version it runs.
# Only tag pushes: a pull request, a fork's included, never reaches the package write permission.
name: Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
      # As in ci.yml: bubblewrap, and the user namespace it needs, for the turn evaluation's workspace (ADR 0051), and rg
      # for search_memory's tests (ADR 0055).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The server: the last stage of the Dockerfile.
          - name: natsumi
            target: ""
          - name: natsumi-workspace
            target: workspace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: type=ref,event=tag
          flavor: latest=false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only: the nodes that run natsumi are all amd64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
