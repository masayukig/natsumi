# Builds the server and workspace images for a version tag and pushes them to ghcr (ADR 0033).
# The image tag is the version tag itself (v0.x.y); the environment pins the version it runs.
# Only tag pushes, and the weekly release (weekly-release.yml), which calls this before it pushes its tag: a tag pushed
# with GITHUB_TOKEN starts no workflow. The weekly release also runs when the vulnerability responder's pull request is
# merged (ADR 0082); no other pull request, and none from a fork, reaches the package write permission.
# A push to main also pushes both images under the moving tag main, which nothing runs: it is there to be scanned for
# vulnerabilities fixed on main but not yet released, and the versions it leaves untagged are deleted (ADR 0081).
name: Images

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: The version tag the images are pushed under, for the commit the caller runs on
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
      # As in ci.yml: bubblewrap, and the user namespace it needs, for the turn evaluation's workspace (ADR 0051), and rg
      # for search_memory's tests (ADR 0055).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Two pushes to main close together would otherwise race, and main could be left on the older commit.
    concurrency:
      group: image-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          # The server: the last stage of the Dockerfile.
          - name: natsumi
            target: ""
          - name: natsumi-workspace
            target: workspace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          flavor: latest=false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Before anything is pushed, the server image runs its entrypoint, which loads every module the server runs: the
      # test job runs the checks on the checkout, where a file the image leaves out is still there. The push below reuses
      # this build's layers.
      - if: matrix.name == 'natsumi'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: natsumi:smoke
      - if: matrix.name == 'natsumi'
        run: docker run --rm --network none --read-only natsumi:smoke avatar check nanashi
      # amd64 only: the nodes that run natsumi are all amd64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Among them org.opencontainers.image.source and org.opencontainers.image.revision, by which the image is
          # traced back to this repository and the commit it was built from.
          labels: ${{ steps.meta.outputs.labels }}

  # Each push to main leaves the image main pointed at before untagged. Only untagged versions are deleted, never a
  # tagged one; an image's platform manifests and attestations are kept or deleted with it. After the deletion, every
  # image left is checked for missing platform manifests, which is only warned of in the log.
  cleanup:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    # The action is not safe to run twice at once against the same package.
    concurrency:
      group: ghcr-cleanup-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      matrix:
        package: [natsumi, natsumi-workspace]
    steps:
      # Pinned to a commit: a third party's action that can delete package versions.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          delete-untagged: true
          validate: true
