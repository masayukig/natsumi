name: natsumi

services:
  natsumi:
    build: .
    image: natsumi:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # HTTPS/WSS with TLS terminated by the server (ADR 0006). Published on the host's IPv4 and IPv6 addresses;
    # IPv6 publishing needs IPv6 enabled in the Docker daemon.
    ports:
      - "${NATSUMI_PORT:-8443}:8443"
    # Secrets are never written in the config. They are mounted under /run/secrets and referenced by ...File settings.
    # The files keep their host permissions: make them readable by the container's node user (UID 1000) only.
    secrets:
      - natsumi_tls_cert
      - natsumi_tls_key
      - natsumi_github_client_secret
    volumes:
      - natsumi-data:/data
      - natsumi-pi:/var/lib/natsumi-pi
      # The runner socket of natsumi-workspace. natsumi never gets the Docker socket (ADR 0011).
      - type: volume
        source: natsumi-workspace-socket
        target: /run/natsumi-workspace
        volume:
          nocopy: true
      - type: bind
        source: ${NATSUMI_CONFIG:-./config.example.json}
        target: /etc/natsumi/config.json
        read_only: true
    healthcheck:
      test: ["CMD", "node", "/app/dist/src/server/main.js", "health", "--data-dir", "/data"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # natsumi's workspace (ADR 0019): an ordinary Debian environment with no network, no secrets, and only the four
  # writable places below. The confinement is this shape; there is no list of allowed commands. natsumi reaches its
  # runner over a Unix socket and never holds the Docker socket.
  natsumi-workspace:
    build:
      context: .
      target: workspace
    image: natsumi-workspace:local
    init: true
    restart: unless-stopped
    # The UID natsumi runs as. Another UID works only in a group shared with natsumi (ADR 0033); this layout keeps one.
    user: "${NATSUMI_WORKSPACE_UID:-1000}:${NATSUMI_WORKSPACE_UID:-1000}"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A workbench rather than a search tool: enough to run a script or a Python aggregation, and small enough that
    # forgotten processes still leave room for the model call and natsumi itself on the same host (ADR 0019).
    pids_limit: 256
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    # noexec is set because there is no reason not to, but it is not a boundary: `python3 /tmp/x.py` ignores it.
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    # The response limit and the bytes of stdout and of stderr kept from one command. The time zone must match
    # loop.timeZone; the server also sends it with every command, so this is only the fallback.
    command: ["serve", "-response-limit", "60s", "-max-output", "65536", "-tz", "${NATSUMI_TIME_ZONE:-UTC}"]
    volumes:
      # Memory: writable, and its history is not. The server owns the commits (ADR 0018).
      # Both subpaths follow loop.memoryRepository: point them at the same place if it is moved out of the
      # data directory's memory/, or the server will commit somewhere natsumi's /memory never shows, with no error.
      - type: volume
        source: natsumi-data
        target: /memory
        volume:
          subpath: memory
          nocopy: true
      - type: volume
        source: natsumi-data
        target: /memory/.git
        read_only: true
        volume:
          subpath: memory/.git
          nocopy: true
      # Where she works and where she lives. Persistent, executable, and never inspected or committed.
      - type: volume
        source: natsumi-data
        target: /work
        volume:
          subpath: work
          nocopy: true
      - type: volume
        source: natsumi-data
        target: /home/natsumi
        volume:
          subpath: home
          nocopy: true
      # Who she can ask, written by natsumi on every start (ADR 0036). Read-only: the manual is for reading.
      - type: volume
        source: natsumi-data
        target: /manual/agents
        read_only: true
        volume:
          subpath: agents
          nocopy: true
      # The page on drawing and the sdctl params, written by natsumi from the avatar on every start (ADR 0057). Read-only.
      - type: volume
        source: natsumi-data
        target: /manual/avatar
        read_only: true
        volume:
          subpath: avatar
          nocopy: true
      # What she reads besides memory, such as the Slack channels, written by natsumi (ADR 0039). Read-only.
      - type: volume
        source: natsumi-data
        target: /sources
        read_only: true
        volume:
          subpath: sources
          nocopy: true
      # The history of /sources, which sources-diff reads (ADR 0050). Read-only: the server commits and moves its refs.
      - type: volume
        source: natsumi-data
        target: /sources.git
        read_only: true
        volume:
          subpath: sources.git
          nocopy: true
      # The owner's skills, a clone the owner keeps in the data directory's skills/ (ADR 0073). Read-only: they are the
      # owner's. Listed in her instructions only with skills.enabled in the config; her own are in /memory/skills.
      - type: volume
        source: natsumi-data
        target: /skills
        read_only: true
        volume:
          subpath: skills
          nocopy: true
      - type: volume
        source: natsumi-workspace-socket
        target: /run/natsumi-workspace
        volume:
          nocopy: true
    # natsumi creates memory/, work/, home/, agents/, sources/, sources.git/ and skills/ in the data directory on its first start.
    depends_on:
      natsumi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/libexec/natsumi-workspace-runner", "check"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  natsumi-data:
  natsumi-pi:
  # A small tmpfs owned by the workspace user, holding only the runner socket.
  natsumi-workspace-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=${NATSUMI_WORKSPACE_UID:-1000},gid=${NATSUMI_WORKSPACE_UID:-1000},mode=0755"

secrets:
  natsumi_tls_cert:
    file: ${NATSUMI_TLS_CERT:-./secrets/tls-cert.pem}
  natsumi_tls_key:
    file: ${NATSUMI_TLS_KEY:-./secrets/tls-key.pem}
  natsumi_github_client_secret:
    file: ${NATSUMI_GITHUB_CLIENT_SECRET_FILE:-./secrets/github-client-secret}
