apiVersion: v1
kind: Service
metadata:
  name: natsumi
  namespace: natsumi
spec:
  selector:
    app.kubernetes.io/name: natsumi
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# TLS ends here (edge); the server listens in plaintext behind it (listen.behindProxy, ADR 0033).
# No authentication at the router, on purpose: login, the API and the WebSocket are all checked by the server
# (GitHub OAuth, ADR 0006). LAN only: this host is on the cluster's default router, not behind cloudflared.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: natsumi
  namespace: natsumi
  annotations:
    # The Mac and iPhone clients hold one WebSocket open; the tunnel timeout is what governs it after the upgrade.
    haproxy.router.openshift.io/timeout: 5m
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  host: natsumi.apps.lab.igawa.io
  to:
    kind: Service
    name: natsumi
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
