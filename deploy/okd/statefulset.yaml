# natsumi on OKD (ADR 0033): the server and her workspace in one pod, joined by the runner's Unix socket.
#
# UIDs: server 1000 (the image's `node`), workspace 1001, both in group 1000; the server and the runner both run with
# umask 007 and make the shared places setgid 2770, so either can write what the other made (ADR 0033).
# One PVC, seen through subPaths: the server gets data/ (the data directory) and pi/ (Pi's state); the workspace gets
# only memory, work, home, and read-only agents, sources and sources.git. SQLite, secrets and Pi never reach it.
#
# A StatefulSet of one: the pod is always natsumi-0 (the README's exec commands assume it), and an update deletes the
# old pod before starting the new one, so the RWO volume is never fought over.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: natsumi
  namespace: natsumi
spec:
  replicas: 1
  serviceName: natsumi
  selector:
    matchLabels:
      app.kubernetes.io/name: natsumi
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: natsumi
        app.kubernetes.io/component: app
      annotations:
        openshift.io/required-scc: natsumi
    spec:
      serviceAccountName: natsumi
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # The default for any container that does not say otherwise. Only egress-rules overrides it, to 0.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        # Recursively re-grouping the volume on every start would also open .natsumi/ and pi/ to the group.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The pod's egress rules, set once in the pod's network namespace before anything else runs (ADR 0034).
        # The only container with NET_ADMIN and the only one running as root; it exits when the rules are in.
        # nftables directly, not iptables: the nodes are SCOS 10 (kernel 6.12), where nf_tables is the backend.
        - name: egress-rules
          # Verified locally to carry nft 1.1.6 (2026-09-28). Swap for a smaller image with nft if one is built.
          image: docker.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          command:
            - /bin/sh
            - -ec
            - |
              nft -f - <<'EOF'
              table inet natsumi
              delete table inet natsumi
              table inet natsumi {
                chain output {
                  type filter hook output priority filter; policy accept;
                  # TODO(ADR 0034): the server (1000) is unrestricted for now. When the SNI proxy sidecar lands,
                  # send its tcp/443 to the proxy, allow its DNS to the cluster DNS only, and reject the rest.
                  # Everything else: no egress at all, DNS and loopback included. That is the workspace (1001), and any
                  # other UID that ever runs here. Packets with no socket (ICMP errors, neighbour discovery) do not
                  # match `meta skuid` and pass.
                  meta skuid != 1000 counter reject
                }
              }
              EOF
              nft list table inet natsumi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
        # Makes the places the containers mount by subPath before the kubelet would make them as root, and makes the
        # memory repository, so that /memory/.git is a repository the server can write (the server's own first start
        # would do this, but the workspace's subPath mounts need the directories to exist before either starts).
        # Existing directories are left alone, like the server does (README: 既にあるディレクトリの持ち主と権限は変えません).
        - name: prepare-data
          image: ghcr.io/masayukig/natsumi:TAG
          command:
            - /bin/sh
            - -ec
            - |
              umask 007
              cd /pvc
              [ -d data ] || mkdir -m 0700 data
              [ -d pi ] || mkdir -m 0700 pi
              cd data
              [ -d .natsumi ] || mkdir -m 0700 .natsumi
              for d in memory work home agents sources sources.git; do
                [ -d "$d" ] || { mkdir "$d"; chmod 2770 "$d"; }
              done
              [ -e memory/.git ] || git -C memory init -q -b main
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /pvc
      containers:
        - name: server
          image: ghcr.io/masayukig/natsumi:TAG
          # The image's CMD: serve --config /etc/natsumi/config.json --data-dir /data
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [node, /app/dist/src/server/main.js, health, --data-dir, /data]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /var/lib/natsumi-pi
              subPath: pi
            - name: workspace-socket
              mountPath: /run/natsumi-workspace
            - name: config
              mountPath: /etc/natsumi
              readOnly: true
            - name: github
              mountPath: /run/secrets/natsumi-github
              readOnly: true
            - name: slack
              mountPath: /run/secrets/natsumi-slack
              readOnly: true
            - name: judge
              mountPath: /run/secrets/natsumi-judge
              readOnly: true
            - name: server-tmp
              mountPath: /tmp
        # natsumi's workspace (ADR 0019): no secrets, no egress (egress-rules), and only the places below.
        - name: workspace
          image: ghcr.io/masayukig/natsumi-workspace:TAG
          # The socket is in a subdirectory the runner makes: the emptyDir itself is not the workspace UID's (README).
          # -tz must match loop.timeZone.
          args: [serve, -socket, /run/natsumi-workspace/runner/runner.sock, -response-limit, 60s, -max-output, "65536", -tz, Asia/Tokyo]
          securityContext:
            runAsUser: 1001
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command: [/usr/libexec/natsumi-workspace-runner, check, -socket, /run/natsumi-workspace/runner/runner.sock]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # compose.yaml: cpus 2, mem_limit 1g. Its pids_limit 256 has no per-container equivalent here; the node's
          # pod pids limit is what bounds a fork bomb.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            # Memory: writable, and its history is not; the server owns the commits (ADR 0018).
            - name: data
              mountPath: /memory
              subPath: data/memory
            - name: data
              mountPath: /memory/.git
              subPath: data/memory/.git
              readOnly: true
            - name: data
              mountPath: /work
              subPath: data/work
            - name: data
              mountPath: /home/natsumi
              subPath: data/home
            - name: data
              mountPath: /manual/agents
              subPath: data/agents
              readOnly: true
            - name: data
              mountPath: /sources
              subPath: data/sources
              readOnly: true
            - name: data
              mountPath: /sources.git
              subPath: data/sources.git
              readOnly: true
            - name: workspace-socket
              mountPath: /run/natsumi-workspace
            - name: workspace-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: natsumi-data
        - name: workspace-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: config
          configMap:
            name: natsumi-config
        - name: github
          secret:
            secretName: natsumi-github
            defaultMode: 288  # 0440: owner root, readable by the fsGroup (1000)
        - name: slack
          secret:
            secretName: natsumi-slack
            defaultMode: 288  # 0440: owner root, readable by the fsGroup (1000)
        # The dove's judge (README 判定の方式): an OpenAI API key of its own, used for logprobs only.
        - name: judge
          secret:
            secretName: natsumi-judge
            defaultMode: 288  # 0440: owner root, readable by the fsGroup (1000)
        - name: server-tmp
          emptyDir: {}
        - name: workspace-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
