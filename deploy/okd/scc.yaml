# The one SCC natsumi's pods run under (ADR 0033, ADR 0034). Pods ask for it by name with the annotation
# openshift.io/required-scc: natsumi, and only the natsumi ServiceAccount may use it (`users` below; no RBAC object).
#
# What it allows, and why:
# - UIDs 0..1001. 1000 is the server (the image's `node`), 1001 the workspace, 0 only the egress-rules init
#   container. An SCC cannot give a range with a hole, so UIDs 1..999 are allowed too; the pod pins every
#   container's UID explicitly and the pod-level default is 1000, so nothing falls to 0 by omission.
# - GID 1000 as fsGroup and supplemental group: the group the server and the workspace share (umask 007, setgid dirs).
# - NET_ADMIN may be ADDED. Nothing adds it by default.
#
# Residual risk (not expressible in an SCC, which applies per pod, not per container):
# - Any container of a pod under this SCC may run as root and add NET_ADMIN, not only the init container. What keeps
#   it to the init container is the StatefulSet spec itself. Whoever can create pods with the natsumi ServiceAccount
#   in the natsumi namespace (namespace admins; the ServiceAccount itself has no RBAC) could start a root container
#   with NET_ADMIN in its own pod network namespace, and so rewrite that pod's egress rules. It cannot reach the host
#   network: hostNetwork, hostPID, hostIPC, host ports, hostPath and privileged stay forbidden.
# - Giving this SCC to a ServiceAccount makes the PodSecurity label syncer raise the namespace's PSA level (to
#   privileged, because of NET_ADMIN and UID 0). The PSA audit no longer watches this namespace; the SCC is the gate.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: natsumi
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
defaultAllowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_ADMIN
defaultAddCapabilities: null
requiredDropCapabilities: []
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 0
  uidRangeMax: 1001
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - secret
  - emptyDir
  - persistentVolumeClaim
  - projected
  - downwardAPI
users:
  - system:serviceaccount:natsumi:natsumi
groups: []
priority: null
