apiVersion: v1
kind: Namespace
metadata:
  name: natsumi
---
# natsumi's own identity (ADR 0033). No Role or RoleBinding names it: she gets no say over the cluster.
# The only thing it is given is the natsumi SCC (scc.yaml, `users`). No token is mounted anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: natsumi
  namespace: natsumi
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: natsumi-data
  namespace: natsumi
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd-shiftlab
  resources:
    requests:
      storage: 10Gi
